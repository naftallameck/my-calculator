<!DOCTYPE html>
<html>
<head>
  <title>My Calculator</title>
  <style>
    body { text-align:center; font-family:sans-serif; background:#222; }
    #screen { width:200px; height:40px; font-size:24px; text-align:right; margin-bottom:8px; }
    button { width:50px; height:50px; font-size:18px; margin:3px; }
  </style>
</head>
<body>
  <h1 style="color:white">My Calculator 🧮</h1>
  <input id="screen" disabled>
  <br>
  <button onclick="press('7')">7</button>
  <button onclick="press('8')">8</button>
  <button onclick="press('9')">9</button>
  <button onclick="press('/')">÷</button><br>

  <button onclick="press('4')">4</button>
  <button onclick="press('5')">5</button>
  <button onclick="press('6')">6</button>
  <button onclick="press('*')">×</button><br>

  <button onclick="press('1')">1</button>
  <button onclick="press('2')">2</button>
  <button onclick="press('3')">3</button>
  <button onclick="press('-')">-</button><br>

  <button onclick="press('0')">0</button>
  <button onclick="clearScreen()">C</button>
  <button onclick="calculate()">=</button>
  <button onclick="press('+')">+</button>

  <script>
    function press(value) {
      document.getElementById('screen').value += value;
    }
    function clearScreen() {
      document.getElementById('screen').value = '';
    }
    function calculate() {
      let expression = document.getElementById('screen').value;
      document.getElementById('screen').value = eval(expression);
    }
  </script>
</body>
</html>
